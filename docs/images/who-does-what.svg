<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="anjawho-title anjawho-desc">
<title id="anjawho-title">Who does what</title>
<desc id="anjawho-desc">You decide; the lead session reports to you. The lead session plans, builds and commits, and leaves anything destructive to you. It runs commands: procedures that pick the specialists and decide how the work runs. Commands bring in and brief the experts: specialists, each with its own knowledge and memory, who never commit. Meta turns your corrections into lessons and keeps the rules, guards, commands and memories current. Rules and guards apply at every level: every session reads the rules that apply to it, and guards refuse or warn at the moment of the act.</desc>
<style>
@media (prefers-color-scheme: dark) {
.anjawho-card{fill:#090909;stroke:#2a2a2a}
.anjawho-t{fill:#fafafa}.anjawho-mu{fill:#a3a3a3}
.anjawho-ink{fill:#00c292}
.anjawho-ln{stroke:#00c292}.anjawho-nd{fill:#00c292}
.anjawho-s1{fill:#081614}.anjawho-s2{fill:#081e18}.anjawho-s3{fill:#082820}
.anjawho-mc{fill:#111111;stroke:#00c292}
.anjawho-flr{stroke:#2e2e2e}
}
</style>
