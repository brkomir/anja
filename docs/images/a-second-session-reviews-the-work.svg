<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 874" width="1200" height="874" role="img" aria-labelledby="anjahub-title anjahub-desc">
<title id="anjahub-title">The review-hub loop: a second session reviews the work</title>
<desc id="anjahub-desc">Your session asks the review hub, a second session, to review its commits: what changed and what to check. The hub queues the request and replies with its place in line. A fresh panel of reviewers reads it; its author never sits on the panel, and a code-design expert always sits on a review of code. The hub checks each finding at its file and line, and the verdict goes back: approved, or changes requested with patches. If approved, the loop closes. If changes are requested, the work is on hold until fixed: your session fixes it in one commit and reports back, and the hub confirms that commit. If anything is still open, it goes back for another fix. The loop closes with a row in the review ledger.</desc>
