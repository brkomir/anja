.anja1v2-s1{fill:#081614}.anja1v2-s2{fill:#081e18}.anja1v2-s3{fill:#082820}
.anja1v2-mc{fill:#111111;stroke:#00c292}
.anja1v2-flr{stroke:#2e2e2e}
}
</style>
