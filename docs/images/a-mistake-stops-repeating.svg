<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="anja1v2-title anja1v2-desc">
<title id="anja1v2-title">How a mistake stops repeating</title>
<desc id="anja1v2-desc">A mistake happens and you correct it. The lesson is written down in memory, which survives the session. If the mistake comes back, the lesson becomes a rule, read by every session it applies to. If it still comes back, it becomes a guard, which refuses or warns at the moment of the act. Then it is measured: did the mistake stop?</desc>
<style>
