<text x="640" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="650" text-anchor="middle" fill="#171717" class="anjacomp-t">compaction</text>
