<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 782" width="1200" height="782" role="img" aria-labelledby="anjacomp-title anjacomp-desc">
<title id="anjacomp-title">What survives a compaction</title>
<desc id="anjacomp-desc">A compaction cuts the session in two. Three things cross the cut whole: the repository, with every file and every commit; the working plan, which says where the work stands; and the memory files, which hold lessons and decisions. Two things do not: the conversation's detail, of which only a summary is left; and rules that were loaded for certain files, which come back when such a file is read again. Before you compact, have the agent write what must carry over into the plan (the pre-compact command). After it, the agent rebuilds its place from the plan, the last exchanges and the mail, and writes only the plan.</desc>
<style>
