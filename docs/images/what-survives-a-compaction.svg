<text x="670" y="578" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#595959" class="anjacomp-mu">back when such a file is read again</text>
<circle cx="56" cy="645" r="7" fill="#199d78" class="anjacomp-nd"/>
<text x="76" y="654" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="650" fill="#171717" class="anjacomp-t">before you compact<tspan dx="14" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" font-weight="400" fill="#595959" class="anjacomp-mu">/pre-compact</tspan></text>
<text x="76" y="685" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#595959" class="anjacomp-mu">have the agent write what must</text>
<text x="76" y="712" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#595959" class="anjacomp-mu">carry over into the plan</text>
