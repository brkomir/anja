<text x="698" y="685" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#595959" class="anjacomp-mu">the agent rebuilds its place from the plan,</text>
<text x="698" y="712" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#595959" class="anjacomp-mu">the last exchanges and the mail,</text>
