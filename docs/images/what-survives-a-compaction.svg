.anjacomp-card{fill:#090909;stroke:#2a2a2a}
.anjacomp-t{fill:#fafafa}.anjacomp-mu{fill:#a3a3a3}
.anjacomp-ink{fill:#00c292}
.anjacomp-ln{stroke:#00c292}.anjacomp-nd{fill:#00c292}
.anjacomp-s1{fill:#081614}.anjacomp-s2{fill:#081e18}.anjacomp-s3{fill:#082820}
.anjacomp-mc{fill:#111111;stroke:#00c292}
.anjacomp-nb{fill:#111111;stroke:#2e2e2e}
.anjacomp-sb{fill:#081e18;stroke:#00c292}
.anjacomp-gh{stroke:#6b6b6b}
.anjacomp-cut{stroke:#a3a3a3}
.anjacomp-flr{stroke:#2e2e2e}
}
</style>
