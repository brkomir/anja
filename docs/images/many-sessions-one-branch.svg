<text x="924" y="433" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#595959" class="anjabr-mu">a pull request,</text>
<text x="924" y="460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#595959" class="anjabr-mu">merged only</text>
<text x="924" y="487" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#595959" class="anjabr-mu">on your word</text>
<rect x="430" y="560" width="410" height="200" rx="14" fill="#f7f7f7" stroke="#199d78" stroke-width="2" stroke-dasharray="7 6" class="anjabr-dc"/>
<path d="M444,560 H826" fill="none" stroke="#199d78" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="14 9" class="anjabr-ln"/>
