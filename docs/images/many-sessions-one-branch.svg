<text x="48" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#171717" class="anjabr-t">Many sessions,</text>
<text x="48" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#171717" class="anjabr-t">one branch</text>
<rect x="48" y="232" width="250" height="112" rx="14" fill="#e4f8ef" class="anjabr-s1"/>
<path d="M64,232 H282" fill="none" stroke="#199d78" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" class="anjabr-ln"/>
<text x="72" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="650" fill="#171717" class="anjabr-t">a session</text>
<text x="72" y="312" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#595959" class="anjabr-mu">commits as it goes</text>
<path d="M173,352 V391" fill="none" stroke="#199d78" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="anjabr-ln" marker-end="url(#anjabr-head)"/>
<text x="187" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="650" fill="#057558" class="anjabr-ink">commits</text>
<rect x="330" y="232" width="250" height="112" rx="14" fill="#e4f8ef" class="anjabr-s1"/>
<path d="M346,232 H564" fill="none" stroke="#199d78" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" class="anjabr-ln"/>
<text x="354" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="650" fill="#171717" class="anjabr-t">a second one</text>
<text x="354" y="312" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#595959" class="anjabr-mu">commits as it goes</text>
<path d="M455,352 V391" fill="none" stroke="#199d78" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="anjabr-ln" marker-end="url(#anjabr-head)"/>
<text x="469" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="650" fill="#057558" class="anjabr-ink">commits</text>
<rect x="612" y="232" width="250" height="112" rx="14" fill="#e4f8ef" class="anjabr-s1"/>
<path d="M628,232 H846" fill="none" stroke="#199d78" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" class="anjabr-ln"/>
<text x="636" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="650" fill="#171717" class="anjabr-t">a third one</text>
<text x="636" y="312" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#595959" class="anjabr-mu">commits as it goes</text>
<path d="M737,352 V391" fill="none" stroke="#199d78" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="anjabr-ln" marker-end="url(#anjabr-head)"/>
<text x="751" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="650" fill="#057558" class="anjabr-ink">commits</text>
<rect x="48" y="401" width="814" height="58" rx="12" fill="#d3f4e6" class="anjabr-s2"/>
<text x="72" y="438" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="650" fill="#171717" class="anjabr-t">the shared branch</text>
<path d="M300,430 H889" fill="none" stroke="#199d78" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="anjabr-ln" marker-end="url(#anjabr-head)"/>
<circle cx="320" cy="430" r="7" fill="#199d78" class="anjabr-nd"/>
