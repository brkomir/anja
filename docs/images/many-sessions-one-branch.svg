<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 808" width="1200" height="808" role="img" aria-labelledby="anjabr-title anjabr-desc">
<title id="anjabr-title">Many sessions, one branch</title>
<desc id="anjabr-desc">Three sessions work in one shared checkout and each commits, in turn, onto one shared branch. When an arc of work would leave files dirty for the others, one session steps off onto its own branch in its own worktree, and the others keep committing on the shared branch meanwhile. When that work is done, its branch is merged back onto the shared branch. Production is a separate exit from the shared branch: a pull request, merged on your word.</desc>
<style>
@media (prefers-color-scheme: dark) {
.anjabr-card{fill:#090909;stroke:#2a2a2a}
.anjabr-t{fill:#fafafa}.anjabr-mu{fill:#a3a3a3}
.anjabr-ink{fill:#00c292}
.anjabr-ln{stroke:#00c292}.anjabr-nd{fill:#00c292}
.anjabr-s1{fill:#081614}.anjabr-s2{fill:#081e18}.anjabr-s3{fill:#082820}
.anjabr-mc{fill:#111111;stroke:#00c292}
.anjabr-dc{fill:#090909;stroke:#00c292}
.anjabr-flr{stroke:#2e2e2e}
}
</style>
<defs><marker id="anjabr-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#199d78" class="anjabr-nd"/></marker></defs>
