<circle cx="450" cy="430" r="7" fill="#199d78" class="anjabr-nd"/>
<circle cx="520" cy="430" r="7" fill="#199d78" class="anjabr-nd"/>
<circle cx="590" cy="430" r="7" fill="#199d78" class="anjabr-nd"/>
<circle cx="660" cy="430" r="7" fill="#199d78" class="anjabr-nd"/>
<circle cx="730" cy="430" r="7" fill="#199d78" class="anjabr-nd"/>
<circle cx="800" cy="430" r="7" fill="#199d78" class="anjabr-nd"/>
<text x="48" y="490" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#595959" class="anjabr-mu">in one checkout, shared by all</text>
<text x="625" y="490" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" text-anchor="middle" fill="#595959" class="anjabr-mu">the others keep committing</text>
<rect x="900" y="355" width="252" height="150" rx="14" fill="#ffffff" stroke="#199d78" stroke-width="2" class="anjabr-mc"/>
