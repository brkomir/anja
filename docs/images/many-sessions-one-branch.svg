<circle cx="560" cy="620" r="7" fill="#199d78" class="anjabr-nd"/>
<circle cx="615" cy="620" r="7" fill="#199d78" class="anjabr-nd"/>
<circle cx="670" cy="620" r="7" fill="#199d78" class="anjabr-nd"/>
<text x="454" y="672" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="650" fill="#171717" class="anjabr-t">its own branch,</text>
<text x="454" y="708" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="650" fill="#171717" class="anjabr-t">in its own worktree</text>
<text x="454" y="742" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#595959" class="anjabr-mu">until that work is done</text>
<text x="425" y="530" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="650" text-anchor="end" fill="#057558" class="anjabr-ink">would leave files dirty</text>
<text x="425" y="557" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="650" text-anchor="end" fill="#057558" class="anjabr-ink">for the others?</text>
<text x="850" y="530" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="650" fill="#057558" class="anjabr-ink">merged back onto</text>
