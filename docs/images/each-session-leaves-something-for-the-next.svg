<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 756" width="1200" height="756" role="img" aria-labelledby="anjacyc-title anjacyc-desc">
<title id="anjacyc-title">Each session leaves something for the next</title>
<desc id="anjacyc-desc">Each session leaves something for the next. Sessions run one after another, and each one starts by reading a shared store: the rules, commands, memories and lessons. At its wrap a session writes down what you corrected or approved: lessons go straight in, proposed changes to rules and commands wait for your yes. Now and then, when you run it, a maintenance check compares the store against the live system; small fixes are made at once and bigger ones wait for you.</desc>
