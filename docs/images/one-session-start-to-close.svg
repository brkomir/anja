<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 752" width="1200" height="752" role="img" aria-labelledby="anjaloop-title anjaloop-desc">
<title id="anjaloop-title">One session, start to close</title>
<desc id="anjaloop-desc">A session starts by orienting: the branch, recent work and other sessions. Then it goes round a loop: say the goal; work, where helper agents may split a large change, but your session is the one that commits it; review, where fresh reviewers read the committed work and you decide which of their fixes land; then the next piece of work. After the last review the session closes, which finds loose ends and saves the decisions. In the middle of the loop sits the working plan: updated whenever the state changes, it carries the session across a compaction. At any time, the summary command says where things stand and what waits on you.</desc>
