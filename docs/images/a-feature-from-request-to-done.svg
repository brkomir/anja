<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 856" width="1200" height="856" role="img" aria-labelledby="anjaflc-title anjaflc-desc">
<title id="anjaflc-title">A feature, from request to done</title>
<desc id="anjaflc-desc">You ask for a feature in a sentence or two. Only when there is a real design choice, a panel of experts weighs it first: they advise, you pick an option. Agents build it in parallel, each on its own files, and none of them commits. Your session commits it once the tests pass, with only its own files. A fresh panel of reviewers reads it, in a second session or in this one. Only if changes are requested, the fixes you accept land in one commit, and a review hub checks them again. Only if you keep a tracker, the feature is marked complete after a final check. Then it is done, and the next piece starts.</desc>
<style>
@media (prefers-color-scheme: dark) {
.anjaflc-card{fill:#090909;stroke:#2a2a2a}
.anjaflc-t{fill:#fafafa}.anjaflc-mu{fill:#a3a3a3}
.anjaflc-ink{fill:#00c292}
.anjaflc-ln{stroke:#00c292}.anjaflc-nd{fill:#00c292}
.anjaflc-s1{fill:#081614}.anjaflc-s2{fill:#081e18}.anjaflc-s3{fill:#082820}
.anjaflc-mc{fill:#111111;stroke:#00c292}
.anjaflc-dc{fill:#090909;stroke:#00c292}
}
</style>
