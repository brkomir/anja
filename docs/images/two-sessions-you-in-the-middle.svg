<text x="72" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#595959" class="anjatwo-mu">works on one goal</text>
<text x="72" y="349" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#595959" class="anjatwo-mu">and commits its work</text>
<circle cx="79" cy="431" r="7" fill="#199d78" class="anjatwo-nd"/>
<text x="96" y="438" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="650" fill="#057558" class="anjatwo-ink">listening for mail</text>
