<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 772" width="1200" height="772" role="img" aria-labelledby="anjatwo-title anjatwo-desc">
<title id="anjatwo-title">Two sessions, you in the middle</title>
<desc id="anjatwo-desc">Two sessions work in one shared checkout; the first works on one goal and commits its work. Each one listens for mail, and mail goes both ways between them. A session shows the mail it receives to you as advice and acts on it only with your go-ahead; you decide which session does what. The second session can have its own goal or review the first one's commits. You can see what each session is doing, and park one until your next message, which stops its listener.</desc>
<style>
@media (prefers-color-scheme: dark) {
.anjatwo-card{fill:#090909;stroke:#2a2a2a}
.anjatwo-t{fill:#fafafa}.anjatwo-mu{fill:#a3a3a3}
.anjatwo-ink{fill:#00c292}
.anjatwo-ln{stroke:#00c292}.anjatwo-nd{fill:#00c292}
.anjatwo-s1{fill:#081614}.anjatwo-s2{fill:#081e18}.anjatwo-s3{fill:#082820}
.anjatwo-mc{fill:#111111;stroke:#00c292}
.anjatwo-nb{fill:#111111;stroke:#2e2e2e}
.anjatwo-sb{fill:#081e18;stroke:#00c292}
.anjatwo-gh{stroke:#6b6b6b}
.anjatwo-cut{stroke:#a3a3a3}
.anjatwo-flr{stroke:#2e2e2e}
}
</style>
