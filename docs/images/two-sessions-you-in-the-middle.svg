<text x="48" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#171717" class="anjatwo-t">you in the middle</text>
<rect x="48" y="242" width="330" height="250" rx="14" fill="#e4f8ef" class="anjatwo-s1"/>
<path d="M62,242 H364" fill="none" stroke="#199d78" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" class="anjatwo-ln"/>
