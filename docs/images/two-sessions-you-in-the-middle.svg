<text x="738.833" y="376" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="650" text-anchor="middle" fill="#057558" class="anjatwo-ink">advice</text>
<text x="738.833" y="466" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="650" text-anchor="middle" fill="#057558" class="anjatwo-ink">go-ahead</text>
<rect x="48" y="566" width="1104" height="58" rx="12" fill="#d3f4e6" class="anjatwo-s2"/>
